name: Build (Windows + Android)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Também gera o APK release assinado (precisa dos Secrets da keystore)"
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_USER:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

env:
  GODOT_VERSION: "4.3"
  GODOT_CHANNEL: "stable"

jobs:
  validate:
    uses: ./.github/workflows/lint.yml

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot ${{ env.GODOT_VERSION }} e export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"
          godot --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK (build-tools, plataforma, cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest"

      - name: Configurar Godot para exportar Android
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          # keystore de debug (gerada na hora; só serve para APKs de teste)
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Importar o projeto (gera o cache de recursos)
        run: |
          godot --headless --path game --import || true
          godot --headless --path game --import

      - name: Exportar Windows
        run: |
          mkdir -p build/windows
          godot --headless --path game --export-release "Windows Desktop"
          cd build/windows && zip -r ../StrikeSoccerWAWA-windows.zip . && cd ../..

      - name: Exportar Android (APK debug)
        run: |
          mkdir -p build/android
          godot --headless --path game --export-debug "Android" ../build/android/StrikeSoccerWAWA-debug.apk

      - name: Exportar Android (APK release assinado)
        if: ${{ inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets da keystore ausentes: pulando o APK release (veja docs/SETUP.md)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEYSTORE_USER"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASS"
          godot --headless --path game --export-release "Android" ../build/android/StrikeSoccerWAWA-release.apk

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: strike-soccer-wawa-builds
          path: |
            build/StrikeSoccerWAWA-windows.zip
            build/android/*.apk
          if-no-files-found: error

      - name: Smoke test headless (roda a partida e confere física, chute, gols e paredes)
        run: |
          set -o pipefail
          timeout 300 godot --headless --fixed-fps 60 --path game -s res://tests/smoke_test.gd 2>&1 | tee smoke.log || true
          grep -q "Resultado: 0 falha" smoke.log || { echo "::error::Smoke test não terminou com 0 falhas (veja o log)"; exit 1; }
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" smoke.log; then
            echo "::error::Erros de script detectados durante o smoke test"
            exit 1
          fi

      - name: Teste de sistemas (menus, bots 4v4, skills, Despertar, missões)
        run: |
          set -o pipefail
          timeout 400 godot --headless --fixed-fps 60 --path game -s res://tests/systems_test.gd 2>&1 | tee systems.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" systems.log | head -20; then
            echo "::error::Erros de script no teste de sistemas"
            exit 1
          fi
          grep -q "Resultado: 0 falha" systems.log || { echo "::error::Teste de sistemas falhou"; grep FALHOU systems.log; exit 1; }
