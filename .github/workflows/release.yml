name: Release

# Cria a GitHub Release automaticamente ao enviar uma tag no formato v*.
# Exemplo:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ÚNICA da Release. Releases/tags antigas são removidas e esta é recriada no commit atual."
        required: true
        default: "v1.0.0-beta"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strike-soccer-wawa-builds
          path: dist

      - name: Manter uma tag só (remove outras releases/tags e recria a atual)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for t in $(gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName'); do
            gh release delete "$t" --repo "$REPO" --cleanup-tag --yes || true
          done
          git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}' | while read -r t; do
            if [ "$t" != "$TAG" ]; then gh api -X DELETE "repos/${REPO}/git/refs/tags/$t" || true; fi
          done

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/android/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          body: |
            Build automática do **Strike Soccer WAWA** (fan game, sem fins lucrativos).
            - Windows: baixe o .zip e execute o .exe
            - Android: baixe o .apk e instale (permita "fontes desconhecidas")
            Veja o CHANGELOG.md para as novidades.
